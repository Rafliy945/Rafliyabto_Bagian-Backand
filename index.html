<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Manager Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            max-width: 1400px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        /* Form Section */
        .form-section {
            padding: 40px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        
        input, textarea, select {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Image Upload */
        .image-upload-container {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        
        .image-preview {
            width: 140px;
            height: 200px;
            border: 3px dashed #d1d5db;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f9fafb;
            position: relative;
        }
        
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-preview-placeholder {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            padding: 10px;
        }

        .upload-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-wrapper {
            position: relative;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            text-align: center;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .file-name {
            font-size: 13px;
            color: #6b7280;
            padding: 8px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .remove-image-btn {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .remove-image-btn:hover {
            background: #dc2626;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d97706;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
        }

        /* Table Section */
        .table-section {
            padding: 40px;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .table-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .search-box {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            width: 300px;
            font-size: 14px;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        
        .series-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.07);
            transition: all 0.3s;
            border: 1px solid #e5e7eb;
        }
        
        .series-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        
        .card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-image-placeholder {
            color: white;
            font-size: 48px;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .card-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .card-genre {
            background: #ede9fe;
            color: #7c3aed;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .card-rating {
            color: #f59e0b;
            font-weight: 600;
        }
        
        .card-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-card {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        
        .btn-youtube {
            background: #ff0000;
            color: white;
        }
        
        .btn-youtube:hover {
            background: #cc0000;
        }
        
        .btn-edit {
            background: #f59e0b;
            color: white;
        }
        
        .btn-edit:hover {
            background: #d97706;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
        }
        
        .btn-delete:hover {
            background: #dc2626;
        }

        /* Modal YouTube */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 0;
            max-width: 900px;
            width: 90%;
            overflow: hidden;
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-close {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .modal-body {
            padding: 0;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                width: 100%;
            }

            .image-upload-container {
                flex-direction: column;
            }

            .image-preview {
                width: 100%;
                height: 250px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🎬 Series Manager Pro</h1>
        <p>Kelola koleksi film dan series favorit Anda dengan mudah</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">
        <div class="form-title">
            <span id="formIcon">➕</span>
            <span id="formTitle">Tambah Series Baru</span>
        </div>
        
        <form id="seriesForm">
            <input type="hidden" id="editId">
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Judul Film/Series</label>
                    <input type="text" id="judul" placeholder="Contoh: The Last of Us" required>
                </div>
                
                <div class="form-group">
                    <label>Genre</label>
                    <select id="genre_id" required>
                        <option value="">-- Pilih Genre --</option>
                        <option value="1">Sci-Fi</option>
                        <option value="2">Drama</option> 
                        <option value="3">Horror</option>
                        <option value="4">Action</option>
                        <option value="5">Comedy</option>
                        <option value="6">Thriller</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Rating (0-10)</label>
                    <input type="number" step="0.1" min="0" max="10" id="rating" placeholder="Contoh: 9.5" required>
                </div>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>📷 Upload Gambar Poster</label>
                    <div class="image-upload-container">
                        <div class="image-preview" id="imagePreview">
                            <div class="image-preview-placeholder">
                                📁<br>Belum ada gambar
                            </div>
                        </div>
                        <div class="upload-controls">
                            <div class="file-input-wrapper">
                                <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(event)">
                                <label for="imageFile" class="file-input-label">
                                    📤 Pilih Gambar Poster
                                </label>
                            </div>
                            <div class="file-name" id="fileName">Tidak ada file dipilih</div>
                            <button type="button" class="remove-image-btn" id="removeImageBtn" onclick="removeImage()" style="display: none;">
                                🗑️ Hapus Gambar
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>🎥 Link YouTube Trailer</label>
                    <input type="url" id="youtube_url" placeholder="https://www.youtube.com/watch?v=...">
                    <small style="color: #6b7280; font-size: 12px;">Link trailer atau review dari YouTube</small>
                </div>
            </div>
            
            <div class="form-group">
                <label>Deskripsi</label>
                <textarea id="deskripsi" placeholder="Ceritakan singkat tentang film/series ini..." required></textarea>
            </div>
            
            <div class="btn-group">
                <button type="submit" id="btnSubmit" class="btn btn-primary">💾 Simpan ke Database</button>
                <button type="button" id="btnCancel" class="btn btn-secondary" style="display:none;" onclick="resetForm()">❌ Batal Edit</button>
            </div>
        </form>
    </div>

    <!-- Table Section -->
    <div class="table-section">
        <div class="table-header">
            <h2>📚 Koleksi Series (Total: <span id="totalCount">0</span>)</h2>
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Cari judul film..." onkeyup="searchSeries()">
        </div>
        
        <div class="card-grid" id="seriesGrid">
            <!-- Cards will be inserted here -->
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <h3>Belum Ada Data</h3>
            <p>Mulai tambahkan film atau series favorit Anda!</p>
        </div>
    </div>
</div>

<!-- Modal YouTube -->
<div class="modal" id="youtubeModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Trailer</h3>
            <button class="modal-close" onclick="closeYoutubeModal()">✕ Tutup</button>
        </div>
        <div class="modal-body">
            <div class="video-container">
                <iframe id="youtubeFrame" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api/series';
    let allSeries = [];
    let currentImageBase64 = null;

    // Genre mapping
    const genreMap = {
        '1': 'Sci-Fi',
        '2': 'Drama',
        '3': 'Horror',
        '4': 'Action',
        '5': 'Comedy',
        '6': 'Thriller'
    };

    // Handle image upload
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            // Check file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('⚠️ Ukuran file terlalu besar! Maksimal 5MB');
                return;
            }

            // Check file type
            if (!file.type.startsWith('image/')) {
                alert('⚠️ File harus berupa gambar!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('removeImageBtn').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    // Remove image
    function removeImage() {
        currentImageBase64 = null;
        document.getElementById('imageFile').value = '';
        document.getElementById('imagePreview').innerHTML = '<div class="image-preview-placeholder">📁<br>Belum ada gambar</div>';
        document.getElementById('fileName').textContent = 'Tidak ada file dipilih';
        document.getElementById('removeImageBtn').style.display = 'none';
    }

    // Fetch series data
    async function fetchSeries() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();

            if (result.success && Array.isArray(result.data)) {
                allSeries = result.data;
                renderSeries(allSeries);
                document.getElementById('totalCount').textContent = allSeries.length;
            }
        } catch (error) {
            console.error('Gagal mengambil data:', error);
            document.getElementById('emptyState').style.display = 'block';
        }
    }

    // Render series cards
    function renderSeries(data) {
        const grid = document.getElementById('seriesGrid');
        const emptyState = document.getElementById('emptyState');
        
        if (data.length === 0) {
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        
        emptyState.style.display = 'none';
        grid.innerHTML = data.map(item => {
            const genreName = genreMap[item.genre_id] || item.genre || 'Unknown';
            const imageData = item.image_data || '';
            const youtubeUrl = item.youtube_url || '';
            
            return `
                <div class="series-card">
                    <div class="card-image">
                        ${imageData ? 
                            `<img src="${imageData}" alt="${item.judul}">` : 
                            '<div class="card-image-placeholder">🎬</div>'
                        }
                    </div>
                    <div class="card-content">
                        <div class="card-title">${item.judul}</div>
                        <div class="card-meta">
                            <span class="card-genre">${genreName}</span>
                            <span class="card-rating">⭐ ${item.rating}</span>
                        </div>
                        <div class="card-description">${item.deskripsi}</div>
                        <div class="card-actions">
                            ${youtubeUrl ? `<button class="btn-card btn-youtube" onclick="openYoutubeModal('${youtubeUrl}', '${item.judul}')">▶ Trailer</button>` : ''}
                            <button class="btn-card btn-edit" onclick='editSeries(${JSON.stringify(item).replace(/'/g, "\\'")})'">✏️ Edit</button>
                            <button class="btn-card btn-delete" onclick="deleteSeries(${item.id})">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Search series
    function searchSeries() {
        const searchTerm = document.getElementById('searchBox').value.toLowerCase();
        const filtered = allSeries.filter(item => 
            item.judul.toLowerCase().includes(searchTerm) ||
            item.deskripsi.toLowerCase().includes(searchTerm)
        );
        renderSeries(filtered);
    }

    // Open YouTube modal
    function openYoutubeModal(url, title) {
        const modal = document.getElementById('youtubeModal');
        const frame = document.getElementById('youtubeFrame');
        const modalTitle = document.getElementById('modalTitle');
        
        // Convert YouTube URL to embed URL
        let videoId = '';
        if (url.includes('youtube.com/watch?v=')) {
            videoId = url.split('v=')[1].split('&')[0];
        } else if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split('?')[0];
        }
        
        if (videoId) {
            frame.src = `https://www.youtube.com/embed/${videoId}`;
            modalTitle.textContent = `${title} - Trailer`;
            modal.classList.add('active');
        } else {
            alert('URL YouTube tidak valid!');
        }
    }

    // Close YouTube modal
    function closeYoutubeModal() {
        const modal = document.getElementById('youtubeModal');
        const frame = document.getElementById('youtubeFrame');
        frame.src = '';
        modal.classList.remove('active');
    }

    // Edit series
    function editSeries(item) {
        document.getElementById('formTitle').innerText = "Edit Series";
        document.getElementById('formIcon').innerText = "✏️";
        document.getElementById('editId').value = item.id;
        document.getElementById('judul').value = item.judul;
        document.getElementById('genre_id').value = item.genre_id;
        document.getElementById('rating').value = item.rating;
        document.getElementById('deskripsi').value = item.deskripsi;
        document.getElementById('youtube_url').value = item.youtube_url || '';
        
        // Load existing image
        if (item.image_data) {
            currentImageBase64 = item.image_data;
            document.getElementById('imagePreview').innerHTML = `<img src="${item.image_data}" alt="Preview">`;
            document.getElementById('fileName').textContent = 'Gambar tersimpan';
            document.getElementById('removeImageBtn').style.display = 'block';
        }
        
        document.getElementById('btnSubmit').innerHTML = "💾 Update Data";
        document.getElementById('btnSubmit').className = "btn btn-warning";
        document.getElementById('btnCancel').style.display = "block";
        
        // Scroll to form
        document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Reset form
    function resetForm() {
        document.getElementById('seriesForm').reset();
        document.getElementById('editId').value = "";
        document.getElementById('formTitle').innerText = "Tambah Series Baru";
        document.getElementById('formIcon').innerText = "➕";
        document.getElementById('btnSubmit').innerHTML = "💾 Simpan ke Database";
        document.getElementById('btnSubmit').className = "btn btn-primary";
        document.getElementById('btnCancel').style.display = "none";
        removeImage();
    }

    // Delete series
    async function deleteSeries(id) {
        if (confirm('Apakah Anda yakin ingin menghapus film ini?')) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchSeries();
                }
            } catch (error) {
                console.error('Error saat menghapus:', error);
            }
        }
    }

    // Submit form
    document.getElementById('seriesForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('editId').value;
        const seriesData = {
            judul: document.getElementById('judul').value,
            genre_id: document.getElementById('genre_id').value,
            rating: parseFloat(document.getElementById('rating').value),
            deskripsi: document.getElementById('deskripsi').value,
            image_data: currentImageBase64,
            youtube_url: document.getElementById('youtube_url').value || null
        };

        const method = id ? 'PATCH' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(seriesData)
            });

            if (response.ok) {
                alert(id ? '✅ Data berhasil diperbarui!' : '✅ Data berhasil ditambahkan!');
                resetForm();
                fetchSeries();
            } else {
                alert('❌ Gagal memproses data. Cek koneksi backend.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Terjadi kesalahan. Pastikan backend sudah berjalan.');
        }
    });

    // Close modal when clicking outside
    document.getElementById('youtubeModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeYoutubeModal();
        }
    });

    // Initial load
    fetchSeries();
</script>

</body>
</html>
